<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ONTA VIP Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="admin-wrap"><div class="admin-top"><div><span class="eyebrow">Panel ONTA VIP</span><h1>Clientes preferenciales</h1><p class="muted">Registros guardados localmente en este prototipo.</p></div><div class="admin-actions"><a class="btn ghost" href="index.html">Volver a la tienda</a><button class="btn primary" id="exportCsv">Exportar CSV</button><button class="btn soft" id="clearData">Limpiar demo</button></div></div><div class="metric-grid"><div class="metric"><span>Total clientes</span><b id="mTotal">0</b></div><div class="metric"><span>Con correo</span><b id="mEmail">0</b></div><div class="metric"><span>Mes actual</span><b id="mMonth">0</b></div><div class="metric"><span>Intereses</span><b id="mInterests">0</b></div></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>WhatsApp</th><th>Correo</th><th>Cumpleaños</th><th>Fecha especial</th><th>Interés</th><th>Registro</th></tr></thead><tbody id="tbody"></tbody></table></div></main><script>const clients=JSON.parse(localStorage.getItem('ontaVipClients')||'[]');const tbody=document.getElementById('tbody');function paint(){document.getElementById('mTotal').textContent=clients.length;document.getElementById('mEmail').textContent=clients.filter(c=>c.email).length;const m=new Date().getMonth()+1;document.getElementById('mMonth').textContent=clients.filter(c=>(c.birthday||'').split('-')[1]==String(m).padStart(2,'0')).length;document.getElementById('mInterests').textContent=new Set(clients.map(c=>c.interest).filter(Boolean)).size;tbody.innerHTML=clients.length?clients.map(c=>`<tr><td>${c.name||''}</td><td>${c.phone||''}</td><td>${c.email||''}</td><td>${c.birthday||''}</td><td>${c.special||''}</td><td>${c.interest||''}</td><td>${(c.createdAt||'').slice(0,10)}</td></tr>`).join(''):'<tr><td colspan="7">Aún no hay clientes registrados.</td></tr>'}paint();document.getElementById('exportCsv').onclick=()=>{const rows=[['Nombre','WhatsApp','Correo','Cumpleaños','Fecha especial','Interés','Registro'],...clients.map(c=>[c.name,c.phone,c.email,c.birthday,c.special,c.interest,c.createdAt])];const csv=rows.map(r=>r.map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='onta-vip-clientes.csv';a.click()};document.getElementById('clearData').onclick=()=>{if(confirm('¿Limpiar registros de demo?')){localStorage.removeItem('ontaVipClients');location.reload()}}</script></body></html>
