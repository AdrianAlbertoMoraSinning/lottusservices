<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sumaq Kitchen Orders</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172630;background:#f3efe6}*{box-sizing:border-box}body{margin:0}.hidden{display:none!important}.login{min-height:100vh;background:#18313d;padding:32px 18px;display:grid;place-items:center}.login>img{width:92px;margin-bottom:16px}.login-card{width:min(430px,100%);background:white;border-radius:24px;padding:28px;box-shadow:0 18px 50px #0002}.login-card span,header small{letter-spacing:.14em;font-weight:800;color:#b01745}.login-card h1,header h1{font-family:Georgia,serif;font-size:42px;margin:6px 0 8px}.login-card label{display:grid;gap:7px;margin:17px 0;font-weight:700}.login-card input{padding:14px;border:1px solid #c9ced1;border-radius:12px;font-size:17px}.login-card button,header button,.filters button,.actions button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.login-card button{width:100%;background:#b01745;color:white;font-size:17px}.msg{min-height:22px;color:#b01745}main{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.head-actions{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stats div{background:white;border-radius:16px;padding:16px;display:flex;gap:10px;align-items:baseline}.stats strong{font-size:28px}.stats span{color:#667}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.filters button{background:#fff}.filters button.active{background:#18313d;color:#fff}.orders{display:grid;gap:12px}.order{background:white;border-radius:18px;padding:18px;border-left:8px solid #6a55a6}.order[data-source="uber_eats"]{border-left-color:#1f8d4d}.order[data-source="skip"]{border-left-color:#e66b22}.order[data-source="web_pickup"]{border-left-color:#b01745}.order-top{display:flex;justify-content:space-between;gap:12px}.source{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.order h2{margin:5px 0;font-size:24px}.meta{display:flex;flex-wrap:wrap;gap:12px;color:#58656c}.items{margin:14px 0;padding:12px;background:#f8f5ef;border-radius:12px}.item{display:flex;justify-content:space-between;padding:5px 0}.notes{font-weight:700;color:#8f2b2b}.print{font-size:13px;font-weight:800}.print.error{color:#a52222}.print.printed{color:#177647}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{background:#e8ecee}.actions button.active{background:#18313d;color:#fff}.actions button.reprint{margin-left:auto;background:#f0d7df;color:#8f1238}@media(max-width:600px){main{padding:14px}.order-top{display:block}.stats div{display:block}.stats span{display:block}.actions button.reprint{margin-left:0}header h1{font-size:32px}}
</style></head><body>
<section id="login" class="login"><img src="assets/sumaq-logo-white.png" alt="Sumaq on 17th"><div class="login-card"><span>Kitchen access</span><h1>Order Hub</h1><p>Pickup, Uber Eats and Skip orders in one kitchen queue.</p><label>Your name<input id="name" autocomplete="name"></label><label>Kitchen PIN<input id="pin" type="password" inputmode="numeric"></label><button id="loginBtn">Open kitchen</button><p id="loginMsg" class="msg"></p></div></section>
<main id="app" class="hidden"><header><div><small>SUMAQ ON 17TH</small><h1>Kitchen Orders</h1></div><div class="head-actions"><button id="refresh">Refresh</button><button id="logout">Sign out</button></div></header><section class="stats"><div><strong id="openCount">0</strong><span>Open</span></div><div><strong id="readyCount">0</strong><span>Ready</span></div><div><strong id="printCount">0</strong><span>Print issues</span></div></section><nav class="filters"><button class="active" data-filter="open">Open</button><button data-filter="all">All</button><button data-filter="web_pickup">Pickup</button><button data-filter="uber_eats">Uber</button><button data-filter="skip">Skip</button></nav><section id="orders" class="orders"></section></main>
<script>(()=>{'use strict';const API='/.netlify/functions/sumaq-kitchen';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('sumaqKitchenToken')||'',name=sessionStorage.getItem('sumaqKitchenName')||'',rows=[],filter='open';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(v)||0);async function call(action,payload={},pin=''){const h={'Content-Type':'application/json','X-Sumaq-Kitchen-Name':name};if(action==='verify')h['X-Sumaq-Kitchen-Pin']=pin;else h['X-Sumaq-Kitchen-Token']=token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,payload}),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Request failed');e.status=r.status;throw e}return j.data}function sourceLabel(s){return s==='uber_eats'?'Uber Eats':s==='skip'?'Skip':'Pickup'}function visible(o){if(filter==='all')return true;if(filter==='open')return !['Completed','Cancelled'].includes(o.kitchen_status);return o.source_channel===filter}function render(){const open=rows.filter(o=>!['Completed','Cancelled'].includes(o.kitchen_status));$('openCount').textContent=open.length;$('readyCount').textContent=rows.filter(o=>o.kitchen_status==='Ready').length;$('printCount').textContent=rows.filter(o=>o.print_job?.status==='error').length;const data=rows.filter(visible);$('orders').innerHTML=data.length?data.map(o=>{const p=o.print_job||{};return `<article class="order" data-source="${esc(o.source_channel||'web_pickup')}"><div class="order-top"><div><div class="source">${esc(sourceLabel(o.source_channel))} · ${esc(o.public_id)}</div><h2>${esc(o.customer_name||'Guest')}</h2><div class="meta"><span>${esc(o.pickup_date||'')}</span><span>${esc(o.pickup_time||'ASAP')}</span><span>${money(o.total)}</span><span>${esc(o.payment_status||'')}</span></div></div><div class="print ${esc(p.status||'')}">Print: ${esc(p.status||'not queued')}${p.last_error?` · ${esc(p.last_error)}`:''}</div></div><div class="items">${(o.items||[]).map(i=>`<div class="item"><span><b>${Number(i.quantity||0)}×</b> ${esc(i.product_name)}</span><span>${money(i.line_total)}</span></div>`).join('')}</div>${o.notes?`<div class="notes">NOTE: ${esc(o.notes)}</div>`:''}<div class="actions">${['New','Preparing','Ready','Completed'].map(s=>`<button data-status="${s}" data-id="${esc(o.id)}" class="${o.kitchen_status===s?'active':''}">${s}</button>`).join('')}<button class="reprint" data-reprint="${esc(o.id)}">Reprint</button></div></article>`}).join(''):'<p>No orders in this view.</p>'}async function load(){try{rows=await call('list');render()}catch(e){if(e.status===401)return logout();$('orders').innerHTML=`<p>${esc(e.message)}</p>`}}async function login(){name=$('name').value.trim();const p=$('pin').value.trim();if(!name||!p)return $('loginMsg').textContent='Enter your name and PIN.';try{const d=await call('verify',{},p);token=d.token;sessionStorage.setItem('sumaqKitchenToken',token);sessionStorage.setItem('sumaqKitchenName',name);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginMsg').textContent=e.message}}function logout(){token='';sessionStorage.removeItem('sumaqKitchenToken');sessionStorage.removeItem('sumaqKitchenName');$('app').classList.add('hidden');$('login').classList.remove('hidden')}$('loginBtn').onclick=login;$('pin').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=logout;$('refresh').onclick=load;document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));render()});document.addEventListener('click',async e=>{const s=e.target.closest('[data-status]');if(s){s.disabled=true;try{await call('update',{id:s.dataset.id,kitchenStatus:s.dataset.status});await load()}finally{s.disabled=false}}const r=e.target.closest('[data-reprint]');if(r){r.disabled=true;try{await call('reprint',{id:r.dataset.reprint});await load()}finally{r.disabled=false}}});if(token&&name){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}setInterval(()=>{if(token)load()},30000)})();
</script></body></html>
