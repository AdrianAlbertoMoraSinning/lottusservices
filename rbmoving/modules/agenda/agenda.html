<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Your Move | RB Moving</title><link rel="stylesheet" href="../../style.css"></head><body><header class="site-header"><a class="brand" href="../../index.html"><span class="logo-truck">RB</span><span><strong>RB MOVING</strong><small>Reliable Brothers Moving</small></span></a><nav class="nav"><a href="../../index.html">Home</a><a href="../../rates.html">Rates</a><a href="admin.html" class="nav-cta">Admin</a></nav></header><main><section class="page-hero"><p class="eyebrow">Online booking</p><h1>Schedule your move.</h1><p>Send the details and RB Moving will confirm availability, crew and final quote.</p></section><section class="section"><form id="bookingForm" class="form-card booking-form"><div class="two"><label>First name<input name="firstName" required></label><label>Last name<input name="lastName"></label></div><div class="two"><label>Phone<input name="phone" required></label><label>Email<input type="email" name="email" required></label></div><div class="two"><label>Preferred date<input type="date" name="date" required></label><label>Preferred time<select name="time"><option>Morning</option><option>Afternoon</option><option>Evening</option><option>Same-day / urgent</option></select></label></div><label>Service needed<select name="service"><option>Full-Service Move</option><option>Heavy Item Moving</option><option>Furniture Assembly & Disassembly</option><option>Packing & Unpacking Support</option><option>Deliveries & Pickups</option><option>Dump Run / Junk Removal</option></select></label><div class="two"><label>Origin address<input name="origin" placeholder="Pickup / origin"></label><label>Destination address<input name="destination" placeholder="Drop-off / destination"></label></div><label>Move details<textarea name="details" placeholder="Apartment size, stairs/elevator, heavy items, truck needed, photos available, etc." required></textarea></label><button class="btn primary" type="submit">Submit booking request</button><p id="bookingMsg" class="note"></p></form></section></main><script src="agenda.js"></script></body></html>
