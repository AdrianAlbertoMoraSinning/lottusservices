<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Invoice | RB Moving</title><link rel="icon" type="image/png" href="assets/favicon.png"><link rel="shortcut icon" href="assets/favicon.ico"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="style.css"></head><body class="invoice-page">
<header class="site-header no-print"><a class="brand brand-logo" href="index.html" aria-label="RB Moving Home"><img src="assets/rb-moving-logo-3d.webp" alt="RB Moving" class="brand-logo-img"><span class="brand-subtitle">Reliable Brothers Moving</span></a><button class="menu-btn" id="menuBtn">Menu</button><nav class="nav" id="nav"><a href="index.html">Home</a><a href="services.html">Services</a><a href="rates.html">Rates</a><a href="booking.html" class="nav-cta">Book Now</a><a href="reviews.html">Reviews</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></header>
<main><section class="section invoice-public-wrap"><div id="invoiceLoading" class="notice">Loading invoice…</div><article id="invoiceDocument" class="invoice-document" hidden></article><div id="invoiceActions" class="invoice-public-actions no-print" hidden><button class="btn ghost dark" id="printInvoice">Print / Save PDF</button><a class="btn primary" id="payInvoiceButton" href="payment.html">Pay Invoice Online</a></div></section></main>
<footer class="footer no-print"><div class="footer-brand"><img src="assets/rb-moving-logo-3d.webp" alt="RB Moving" class="footer-logo"><p>Calgary, Alberta</p></div><div><a href="tel:+18255838582">(825) 583-8582</a><a href="mailto:info@rbmoving.ca">info@rbmoving.ca</a></div><div><a href="booking.html">Book Now</a><a href="payment.html">Pay Invoice</a></div></footer>
<script src="app.js"></script><script src="supabase-config.js"></script><script src="data-api.js"></script><script src="booking-app.js"></script><script>
(function(){const q=new URLSearchParams(location.search),token=q.get('token')||'',loading=document.getElementById('invoiceLoading'),doc=document.getElementById('invoiceDocument'),actions=document.getElementById('invoiceActions'),pay=document.getElementById('payInvoiceButton');const esc=RBM.escapeHtml,m=RBM.money;
function statusClass(s){return 'status-'+String(s||'').toLowerCase().replace(/\s+/g,'-')}
async function load(){if(!token){loading.textContent='This invoice link is incomplete. Please request a new invoice link from RB Moving.';return}try{const r=await RBMData.rpc('get_public_invoice_by_token',{p_token:token});const i=Array.isArray(r)?r[0]:r;if(!i){loading.textContent='Invoice not found or the link is no longer valid.';return}const items=Array.isArray(i.items)?i.items:[];doc.innerHTML=`<div class="invoice-brand-row"><div><img src="assets/rb-moving-logo-3d.webp" alt="RB Moving" class="invoice-logo"><p>Reliable Brothers Moving<br>Calgary, Alberta<br><a href="tel:+18255838582">(825) 583-8582</a><br><a href="mailto:info@rbmoving.ca">info@rbmoving.ca</a></p></div><div class="invoice-heading"><span>INVOICE</span><h1>${esc(i.invoice_number)}</h1><span class="invoice-status ${statusClass(i.status)}">${esc(i.status)}</span></div></div><div class="invoice-meta-grid"><div><span>Bill To</span><strong>${esc(i.client_name||'Client')}</strong><p>${esc(i.client_email||'')}<br>${esc(i.client_phone||'')}</p></div><div><span>Invoice Date</span><strong>${esc(i.invoice_date||'')}</strong><span>Due Date</span><strong>${esc(i.due_date||'Upon receipt')}</strong></div>${i.booking_reference?`<div><span>Booking</span><strong>${esc(i.booking_reference)}</strong><span>Service Date</span><strong>${esc(i.service_date||'')}</strong></div>`:''}</div>${i.origin||i.destination?`<div class="invoice-route"><span>Service Route</span><strong>${esc(i.origin||'')} ${i.destination?'→ '+esc(i.destination):''}</strong></div>`:''}<div class="invoice-table-wrap"><table class="invoice-table"><thead><tr><th>Service / Description</th><th>Hours / Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${items.length?items.map(x=>`<tr><td>${esc(x.description)}</td><td>${Number(x.qty)} ${esc(x.unit||'')}</td><td>${m(x.unit_rate)}</td><td>${m(x.line_total)}</td></tr>`).join(''):`<tr><td>RB Moving services</td><td>—</td><td>—</td><td>${m(i.subtotal)}</td></tr>`}</tbody></table></div><div class="invoice-summary-box"><div><span>Subtotal</span><strong>${m(i.subtotal)}</strong></div><div><span>GST ${Number(i.gst_rate||0).toFixed(2)}%</span><strong>${m(i.gst_amount)}</strong></div><div class="invoice-grand"><span>Total</span><strong>${m(i.total_amount)}</strong></div></div>${i.note?`<div class="invoice-notes"><strong>Notes</strong><p>${esc(i.note)}</p></div>`:''}<div class="invoice-thanks">Thank you for choosing RB Moving.</div>`;loading.hidden=true;doc.hidden=false;actions.hidden=false;pay.href='payment.html?token='+encodeURIComponent(token);if(String(i.status).toLowerCase()==='paid'){pay.textContent='Invoice Paid';pay.classList.add('disabled-link');pay.removeAttribute('href')}}catch(e){console.error(e);loading.innerHTML='<strong>Unable to load this invoice.</strong><br>Please contact RB Moving for assistance.'}}
document.getElementById('printInvoice').onclick=()=>window.print();load();})();
</script></body></html>
