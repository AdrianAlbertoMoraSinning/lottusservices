<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Payment Approved | RB Moving</title><link rel="stylesheet" href="style.css"></head><body><main class="success"><p class="eyebrow">Demo approval</p><h1>Your payment simulation was approved.</h1><div id="successDetails" class="summary-card" style="max-width:620px;margin:24px auto"></div><p>This is a prototype confirmation only. No real card charge was made. RB Moving will confirm the booking, crew and final invoice.</p><a class="btn primary" href="index.html">Back to home</a> <a class="btn ghost dark" href="modules/agenda/admin.html">Administration</a></main><script src="booking-app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let b={};try{b=JSON.parse(sessionStorage.getItem('rbm_last_success'))||{}}catch{}document.getElementById('successDetails').innerHTML=`<p><strong>Booking:</strong> ${RBM.escapeHtml(b.id||'Demo')}</p><p><strong>Payment reference:</strong> <span class="success-code">${RBM.escapeHtml(b.paymentReference||'DEMO')}</span></p><p><strong>Demo amount:</strong> ${RBM.money(b.paidAmount||0)}</p><p><strong>Status:</strong> ${RBM.escapeHtml(b.paymentStatus||'Demo Approved')}</p>${b.date?`<p><strong>Service:</strong> ${RBM.escapeHtml(b.date)} · ${RBM.escapeHtml(b.time)}</p>`:''}`;});</script></body></html>
